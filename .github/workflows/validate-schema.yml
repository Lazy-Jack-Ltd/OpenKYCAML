name: Validate Schema & Examples

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "schema/**"
      - "examples/**"
      - "tools/**"
      - "iso20022-integration/**"
      - "docs/**"
      - ".github/workflows/validate-schema.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "schema/**"
      - "examples/**"
      - "tools/**"
      - "iso20022-integration/**"
      - "docs/**"
      - ".github/workflows/validate-schema.yml"

permissions:
  contents: read

jobs:
  validate-python:
    name: Validate examples (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/python/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/python/requirements.txt

      - name: Validate schema is valid JSON Schema (draft 2020-12)
        run: |
          python - <<'EOF'
          import json, sys
          from jsonschema import Draft202012Validator
          with open("schema/kyc-aml-hybrid-extended.json") as f:
              schema = json.load(f)
          try:
              Draft202012Validator.check_schema(schema)
              print("Schema meta-validation: PASSED")
          except Exception as e:
              print(f"Schema meta-validation: FAILED — {e}")
              sys.exit(1)
          EOF

      - name: Validate all example payloads
        run: |
          python - <<'EOF'
          import json, sys, pathlib
          from jsonschema import Draft202012Validator

          schema_path = pathlib.Path("schema/kyc-aml-hybrid-extended.json")
          examples_dir = pathlib.Path("examples")

          with open(schema_path) as f:
              schema = json.load(f)

          validator = Draft202012Validator(schema)
          failed = 0

          for example in sorted(examples_dir.glob("*.json")):
              with open(example) as f:
                  payload = json.load(f)
              errors = list(validator.iter_errors(payload))
              if errors:
                  print(f"FAIL: {example.name}")
                  for e in errors:
                      path = ".".join(str(p) for p in e.absolute_path)
                      print(f"      [{path or 'root'}] {e.message}")
                  failed += 1
              else:
                  print(f"PASS: {example.name}")

          if failed:
              print(f"\n{failed} example(s) failed validation.")
              sys.exit(1)
          else:
              print(f"\nAll {len(list(examples_dir.glob('*.json')))} examples passed.")
          EOF

      - name: Validate versioned schema copy matches canonical schema
        run: |
          python - <<'EOF'
          import json, sys

          with open("schema/kyc-aml-hybrid-extended.json") as f:
              canonical = json.load(f)

          import pathlib
          for versioned in pathlib.Path("schema/versions").glob("*.json"):
              with open(versioned) as f:
                  version_copy = json.load(f)
              if canonical != version_copy:
                  print(f"WARN: {versioned} differs from canonical schema. This may be intentional for older versions.")
              else:
                  print(f"PASS: {versioned.name} matches canonical schema.")
          EOF

  validate-node:
    name: Validate examples (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/javascript/package.json

      - name: Install dependencies
        working-directory: tools/javascript
        run: npm install

      - name: Validate all example payloads
        working-directory: tools/javascript
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const { OpenKYCAMLValidator } = require('./validator');

          const examplesDir = path.resolve(__dirname, '../../examples');
          const validator = new OpenKYCAMLValidator();

          const files = fs.readdirSync(examplesDir).filter(f => f.endsWith('.json'));
          let failed = 0;

          for (const file of files.sort()) {
            const result = validator.validateFile(path.join(examplesDir, file));
            if (result.isValid) {
              console.log(`PASS: ${file}`);
            } else {
              console.error(`FAIL: ${file}`);
              for (const err of result.errors) {
                console.error(`      [${err.instancePath}] ${err.message}`);
              }
              failed++;
            }
          }

          if (failed > 0) {
            console.error(`\n${failed} example(s) failed.`);
            process.exit(1);
          } else {
            console.log(`\nAll ${files.length} examples passed.`);
          }
          EOF

  validate-iso20022:
    name: Validate ISO 20022 integration (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: iso20022-integration/test-suite/requirements.txt

      - name: Install dependencies
        run: pip install -r iso20022-integration/test-suite/requirements.txt

      - name: Run ISO 20022 test suite
        run: pytest iso20022-integration/test-suite/ -v

  validate-go:
    name: Validate Go validator (build + test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: tools/go/go.sum

      - name: Build Go validator
        working-directory: tools/go
        run: go build ./...

      - name: Run Go tests
        working-directory: tools/go
        run: go test ./... -v

  lint-json:
    name: Lint JSON formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JSON files are well-formed
        run: |
          find schema examples -name "*.json" | while read f; do
            if python3 -c "import json; json.load(open('$f'))" 2>/dev/null; then
              echo "PASS: $f"
            else
              echo "FAIL: $f — not valid JSON"
              exit 1
            fi
          done

  lint-naming:
    name: Lint file naming convention
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check file naming convention
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          # Root-level conventional filenames that are exempt from kebab-case rule
          ROOT_EXEMPT = {
              "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "GOVERNANCE.md",
              "LICENSE", "SECURITY.md", "ROADMAP.md", "CODE_OF_CONDUCT.md", "NOTICE",
              "pyproject.toml", ".gitignore", ".namingignore",
          }

          # Filenames that are conventional regardless of their directory
          ALWAYS_EXEMPT_NAMES = {"README.md", "EXAMPLES.md"}

          # Directories whose contents follow language-idiomatic snake_case (Python, Go)
          SNAKE_CASE_DIRS = {
              "tools/python",
              "tools/go",
              "iso20022-integration/libraries/python",
              "iso20022-integration/test-suite",
          }

          # Directory path prefixes to skip entirely (hidden, generated, etc.)
          SKIP_PREFIXES = (
              ".git/", ".github/",
              "iso20022-integration/test-suite/validation-tests/compiled/",
          )

          KEBAB_RE = re.compile(r'^[a-z0-9][a-z0-9\-\.]*$')
          SNAKE_RE = re.compile(r'^[a-z0-9][a-z0-9_\.]*$')

          def is_snake_case_dir(path: pathlib.Path) -> bool:
              path_str = path.as_posix()
              return any(path_str.startswith(d) for d in SNAKE_CASE_DIRS)

          failed = []
          root = pathlib.Path(".")

          for p in sorted(root.rglob("*")):
              if p.is_dir():
                  continue
              parts = p.parts
              rel = p.as_posix()

              # Skip hidden dirs and known generated paths
              if any(part.startswith(".") for part in parts):
                  continue
              if any(part.startswith("__") for part in parts):
                  continue
              if any(rel.startswith(prefix) for prefix in SKIP_PREFIXES):
                  continue

              name = p.name

              # Conventional filenames are always allowed anywhere
              if name in ALWAYS_EXEMPT_NAMES:
                  continue

              # Root-level files
              if len(parts) == 1:
                  if name not in ROOT_EXEMPT:
                      if not KEBAB_RE.match(name):
                          failed.append((rel, "root file should be kebab-case or in ROOT_EXEMPT"))
                  continue

              # Check directory names
              for i, part in enumerate(parts[:-1]):
                  dir_path = "/".join(parts[:i+1])
                  if part.startswith("."):
                      break
                  if is_snake_case_dir(pathlib.Path(dir_path)):
                      continue
                  if not KEBAB_RE.match(part):
                      failed.append((dir_path + "/", f"directory '{part}' should be kebab-case"))

              # Check filename
              if is_snake_case_dir(p.parent):
                  if not SNAKE_RE.match(name):
                      failed.append((rel, "snake_case expected for this language"))
              else:
                  if not KEBAB_RE.match(name):
                      failed.append((rel, "kebab-case expected"))

          if failed:
              print("Naming convention violations found:")
              for path, reason in failed:
                  print(f"  FAIL: {path}  ({reason})")
              sys.exit(1)
          else:
              print("All file and directory names comply with the naming convention.")
          EOF
